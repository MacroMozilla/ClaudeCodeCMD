<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeCodeCMD · Claude Code 命令速查</title>
<meta name="description" content="Claude Code 命令速查表。一屏看完 19 条命令，点命令名展开细节，一键复制。每条都写清楚什么时候用、什么时候别用、有什么坑。">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="ClaudeCodeCMD">
<meta property="og:description" content="Claude Code 命令速查 · 复制即用">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌘</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <h1 id="site-title">ClaudeCodeCMD</h1>
      <p id="site-tagline" class="tagline"></p>
      <div class="controls">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input type="search" id="search" autocomplete="off" spellcheck="false" aria-label="搜索命令">
          <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" hidden>&times;</button>
        </div>
        <nav id="filters" class="filters" aria-label="按分类筛选"></nav>
      </div>
    </div>

    <!-- ① 推荐执行顺序：压成一条横带 -->
    <nav id="flow-strip" class="flow-strip" aria-label="推荐执行顺序"></nav>
  </div>
</header>

<main id="main" class="wrap">

  <!-- ② 全部命令：一张大表 -->
  <section id="sec-table" class="section" data-section="table">
    <table class="cmd-table">
      <colgroup>
        <col class="w-command"><col class="w-risk"><col class="w-summary">
        <col class="w-pairs"><col class="w-copy">
      </colgroup>
      <thead>
        <tr id="table-head"></tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
    <p id="empty-state" class="empty-state" hidden></p>
  </section>

  <!-- ③ 内置命令 -->
  <section id="sec-builtin" class="section section-minor" data-section="builtin">
    <details>
      <summary class="minor-summary">
        <span class="sec-index"></span> <span class="sec-title"></span>
        <span class="sec-subtitle"></span>
      </summary>
      <div id="builtin-body"></div>
    </details>
  </section>

  <!-- ④ 不建议这么做 -->
  <section id="sec-antipatterns" class="section section-minor" data-section="antipatterns">
    <details>
      <summary class="minor-summary">
        <span class="sec-index"></span> <span class="sec-title"></span>
        <span class="sec-subtitle"></span>
      </summary>
      <ol id="antipatterns" class="antipatterns"></ol>
    </details>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="sources"></p>
    <p id="disclaimer" class="disclaimer"></p>
    <p class="meta-line">
      <a href="https://github.com/MacroMozilla/ClaudeCodeCMD">GitHub</a> ·
      <a href="https://github.com/MacroMozilla/ClaudeCodeCMD/blob/master/LICENSE">MIT</a> ·
      <span id="version"></span>
    </p>
  </div>
</footer>

<noscript>
  <div class="wrap noscript">
    这个页面靠 JavaScript 渲染 <code>commands.json</code>。不想开 JS 的话，
    <a href="https://github.com/MacroMozilla/ClaudeCodeCMD#readme">README</a>
    里有同样内容的纯文本版。
  </div>
</noscript>

<script src="app.js"></script>
</body>
</html>
