name: Validate commands.json

# 内容和代码分离的代价：commands.json 一旦语法错或引用不上，整站白屏。
# 这个 workflow 只做校验，不部署 —— 部署由 Pages 的分支直发负责。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Schema and grouping
        run: |
          python3 - <<'PY'
          import json, sys, re, collections
          d = json.load(open('commands.json', encoding='utf-8'))
          b = d['builtins']
          errs = []
          titles = [g['title'] for g in b['groups']]
          seen = collections.Counter()

          for i in b['items']:
              c = i.get('command', '?')
              for k in ('command', 'purpose', 'kind', 'group'):
                  if not i.get(k): errs.append(f"{c}: 缺字段 {k}")
              if not str(i.get('command', '')).startswith('/'):
                  errs.append(f"{c}: 命令名必须以 / 开头")
              if i.get('kind') not in ('builtin', 'skill', 'workflow'):
                  errs.append(f"{c}: kind 非法 {i.get('kind')}")
              if i.get('group') not in titles:
                  errs.append(f"{c}: 分组 {i.get('group')} 未定义")
              seen[i['command']] += 1
              for a in i.get('aliases', []):
                  seen[a] += 1

          for name, n in seen.items():
              if n > 1: errs.append(f"{name}: 重复出现 {n} 次（主名和别名不能撞）")

          for g in b['groups']:
              if not any(i['group'] == g['title'] for i in b['items']):
                  errs.append(f"分组「{g['title']}」是空的，页面上会留一个空标题")

          # 配对指向不存在的命令 = 页面上一个点不动的死链
          names = {i['command'] for i in b['items']}
          npairs = 0
          for i in b['items']:
              for side in ('before', 'after'):
                  for pr in i.get('pairs', {}).get(side, []):
                      npairs += 1
                      if pr.get('command') not in names:
                          errs.append(f"{i['command']}: 配对指向不存在的 {pr.get('command')}")
                      if not pr.get('why'):
                          errs.append(f"{i['command']} -> {pr.get('command')}: 配对没写理由")
                      if pr.get('command') == i['command']:
                          errs.append(f"{i['command']}: 配对指向了自己")

          # 这张表只写「当前版本还能用的」—— 墓碑行不许再混进来
          for i in b['items']:
              if any(w in i['purpose'] for w in ('已移除', '已废弃', 'Removed in', 'Deprecated')):
                  errs.append(f"{i['command']}: 说明里写着已移除/已废弃，这类命令应该整条删掉")

          # 页顶那两个时间：快照和实时查询的接口都得在，缺一个横幅就画不出来
          up = d['meta'].get('upstream') or {}
          for k in ('api', 'apiFallback', 'packageName', 'changelog', 'channel',
                    'checkedVersion', 'checkedReleasedAt'):
              if not up.get(k): errs.append(f"meta.upstream 缺字段 {k}")
          fr = d['ui'].get('freshness') or {}
          for k in ('lead', 'upstreamLabel', 'upstreamHint', 'pageLabel', 'pageHint', 'loading',
                    'versionPrefix', 'releasedAt', 'checkedAgainst', 'offlineNote',
                    'verdictFresh', 'verdictBehind', 'verdictUnknown',
                    'gapDays', 'gapSameDay', 'changelogLink'):
              if not fr.get(k): errs.append(f"ui.freshness 缺字段 {k}")
          if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', d['meta'].get('updated', '')):
              errs.append("meta.updated 必须是 YYYY-MM-DD —— 页面拿它当「本页核对时间」")

          if errs:
              print('\n'.join('  ✗ ' + e for e in errs)); sys.exit(1)
          na = sum(len(i.get('aliases', [])) for i in b['items'])
          print(f"OK — {len(b['items'])} 条命令 / {na} 个别名 / {len(b['groups'])} 个分组 / {npairs} 条配对，引用全部可解析")
          print(f"     核到 v{up['checkedVersion']}（{up['checkedReleasedAt']}），本页 {d['meta']['updated']}")
          PY

      - name: index.html asset versions match contentVersion
        run: |
          python3 - <<'PY'
          import json, re, sys
          ver = json.load(open('commands.json', encoding='utf-8'))['meta']['contentVersion']
          html = open('index.html', encoding='utf-8').read()
          errs = []
          for asset in ('style.css', 'app.js'):
              m = re.search(re.escape(asset) + r'\?v=([0-9A-Za-z.\-]+)', html)
              if not m:
                  errs.append(f"index.html 里 {asset} 没带 ?v= 版本号 —— "
                              f"GitHub Pages 发 max-age=600，改完 10 分钟内用户还会看到旧版")
              elif m.group(1) != ver:
                  errs.append(f"{asset} 的 ?v={m.group(1)} 和 contentVersion={ver} 对不上")
          if errs:
              print('\n'.join('  ✗ ' + e for e in errs)); sys.exit(1)
          print(f"OK — style.css / app.js 都带 ?v={ver}，与 contentVersion 一致")
          PY

      - name: Page renders every command row
        run: |
          npm i --silent --no-fund --no-audit playwright >/dev/null 2>&1
          # runner 上没有预装浏览器，装包不等于装 chromium
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          node -e "
          const { chromium } = require('playwright');
          const data = require('./commands.json');
          const up = data.meta.upstream;

          // 三种上游应答都得走通：一样 / 落后 / 查不到
          const pkg = (version, date) => JSON.stringify({ objects: [{ package: {
            name: up.packageName, version, date } }] });
          const CASES = [
            ['同版本',  1280, r => r.fulfill({ status: 200, contentType: 'application/json',
                                 body: pkg(up.checkedVersion, up.checkedReleasedAt) }), 'fresh'],
            ['上游更新', 1280, r => r.fulfill({ status: 200, contentType: 'application/json',
                                 body: pkg('9.9.9', '2099-01-01T00:00:00.000Z') }),      'behind'],
            ['查不到',   1280, r => r.abort(),                                            'unknown'],
            ['宽屏',     2560, r => r.fulfill({ status: 200, contentType: 'application/json',
                                 body: pkg('9.9.9', '2099-01-01T00:00:00.000Z') }),      'behind'],
            ['窄屏',      390, r => r.fulfill({ status: 200, contentType: 'application/json',
                                 body: pkg('9.9.9', '2099-01-01T00:00:00.000Z') }),      'behind'],
          ];

          (async () => {
            const b = await chromium.launch();
            const fails = [];
            for (const [label, width, handler, want] of CASES) {
              const p = await b.newPage({ viewport: { width, height: 900 } });
              const errs = [];
              p.on('pageerror', e => errs.push('pageerror: ' + e.message));
              p.on('console', m => {
                if (m.type() !== 'error') return;
                // 查不到最新版只是降级到快照，浏览器为此打的 net::ERR 不算页面 bug
                if (((m.location() || {}).url || '').includes('registry.npmjs.org')) return;
                errs.push('console: ' + m.text());
              });
              await p.route('**registry.npmjs.org/**', handler);
              await p.goto('http://127.0.0.1:8899/', { waitUntil: 'networkidle' });
              await p.waitForFunction(
                () => document.querySelector('#freshness').dataset.state !== 'loading',
                null, { timeout: 15000 });
              const o = await p.evaluate(() => {
                const box = s => document.querySelector(s).getBoundingClientRect();
                const vw = document.documentElement.clientWidth;
                const hdr = box('.header-inner'), fresh = box('#freshness'), tbl = box('#builtin-body');
                const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
                return {
                  state: document.querySelector('#freshness').dataset.state,
                  upValue: document.querySelector('#fr-up-value').textContent,
                  rows: document.querySelectorAll('tr.bi-row').length,
                  cards: document.querySelectorAll('section.group-card').length,
                  overflow: document.documentElement.scrollWidth - vw,
                  // 每张卡片一张表，第一列宽度必须一致，否则各卡片的列会错开
                  colWidths: [...new Set([...document.querySelectorAll('table.bi-table')].map(
                    t => Math.round(t.querySelector('col.w-bicmd').getBoundingClientRect().width)))].length,
                  freshTop: fresh.top,
                  firstCardTop: box('section.group-card').top,
                  // 顶栏和时间条要摊满浏览器；命令表要收在 78rem 里居中
                  headerSlackL: hdr.left, headerSlackR: vw - hdr.right,
                  freshSlackL: fresh.left, freshSlackR: vw - fresh.right,
                  tableWidth: tbl.width, tableOffCenterBy: Math.abs((tbl.left + tbl.right) / 2 - vw / 2),
                  maxTable: 78 * rem,
                  // 顶栏高度随视口变，sticky 的列名行必须正好贴在顶栏底下
                  headerVar: getComputedStyle(document.documentElement).getPropertyValue('--header-h').trim(),
                  headerH: box('.site-header').height,
                };
              });
              await p.close();
              const add = m => fails.push(label + ': ' + m);
              if (errs.length) add('页面报错 ' + errs.join(' | '));
              if (o.rows !== data.builtins.items.length) add(\`应渲染 \${data.builtins.items.length} 行，实际 \${o.rows}\`);
              if (o.cards !== data.builtins.groups.length) add(\`应 \${data.builtins.groups.length} 张分组卡片，实际 \${o.cards}\`);
              if (o.overflow > 0) add('出现横向溢出 ' + o.overflow + 'px');
              if (o.state !== want) add(\`新鲜度状态应为 \${want}，实际 \${o.state}\`);
              if (o.freshTop >= o.firstCardTop) add('两个时间没排在命令表上面');
              // 窄屏故意退回 table-layout:auto，只在宽屏要求列对齐
              if (width >= 1280 && o.colWidths !== 1) add('各卡片列宽没对齐');
              if (want === 'unknown' && !o.upValue.includes(up.checkedVersion)) add('查不到时没退回 meta.upstream 快照');

              // 顶栏和时间条铺满整个浏览器（只留侧边留白），不跟着表格收窄
              const SIDE = 40;
              for (const [what, l, r] of [['顶栏', o.headerSlackL, o.headerSlackR],
                                          ['时间条', o.freshSlackL, o.freshSlackR]]) {
                if (l > SIDE || r > SIDE) add(\`\${what}没铺满，两侧空了 \${Math.round(l)}/\${Math.round(r)}px\`);
              }
              // 命令表反过来必须收窄居中，不能跟着一起摊开
              if (o.tableWidth > o.maxTable + 1) add(\`命令表宽 \${Math.round(o.tableWidth)}px，超过 78rem\`);
              if (o.tableOffCenterBy > 2) add(\`命令表没居中，偏 \${Math.round(o.tableOffCenterBy)}px\`);
              // sticky 的列名行贴着顶栏底部，顶栏高度变了它得跟着变
              if (Math.abs(parseFloat(o.headerVar) - o.headerH) > 1) {
                add(\`--header-h=\${o.headerVar} 和实测顶栏高 \${Math.round(o.headerH)}px 对不上\`);
              }
              console.log(\`  \${fails.length ? '·' : '✓'} \${label}（\${width}px）→ \${o.state}，\${o.rows} 行 / \${o.cards} 张卡片，\` +
                \`顶栏满宽 · 表 \${Math.round(o.tableWidth)}px 居中 · --header-h=\${o.headerVar}\`);
            }
            await b.close();
            if (fails.length) { console.error(fails.join('\n')); process.exit(1); }
            console.log('OK — 渲染、分组、新鲜度横幅（在线/落后/离线）全部正常');
          })();
          "
