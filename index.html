<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaudeCodeCMD · Claude Code 内置命令速查</title>
<meta name="description" content="Claude Code 内置命令速查表：106 条命令 + 19 个别名，常用的排在最前，按用途分组，可搜索。已被官方移除的命令一条不收，页顶实时显示上游最新版和本页核对时间的差。">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="ClaudeCodeCMD">
<meta property="og:description" content="Claude Code 内置命令速查 · 106 条全收录">
<meta property="og:type" content="website">
<!-- ?v= 跟着 commands.json 的 contentVersion 走：GitHub Pages 给静态资源发 max-age=600，
     不带版本号的话改完 10 分钟内浏览器还在用旧的 JS/CSS，页面看起来「没更新」。CI 会校验两者一致。 -->
<link rel="stylesheet" href="style.css?v=4.3.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌘</text></svg>">
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <h1 id="site-title">ClaudeCodeCMD</h1>
      <p id="site-tagline" class="tagline"></p>
      <div class="controls">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
          </svg>
          <input type="search" id="search" autocomplete="off" spellcheck="false" aria-label="搜索命令">
          <button type="button" id="search-clear" class="search-clear" aria-label="清空搜索" hidden>&times;</button>
        </div>
        <nav id="filters" class="filters" aria-label="按类型筛选"></nav>
      </div>
    </div>
    <nav id="group-jump" class="flow-strip" aria-label="跳到分组"></nav>
  </div>
</header>

<main id="main" class="wrap">

  <!-- 新鲜度：左边是 npm 上现查的 Claude Code 最新版，右边是本页核对时间。
       两个时间之间的差 = 这页落后了多少。查不到就退回 meta.upstream 里的快照。 -->
  <section id="freshness" class="freshness" aria-live="polite">
    <p id="fr-lead" class="fr-lead"></p>
    <div class="fr-row">
      <div class="fr-card">
        <span class="fr-label" id="fr-up-label"></span>
        <strong class="fr-value" id="fr-up-value">…</strong>
        <span class="fr-sub" id="fr-up-sub"></span>
        <span class="fr-hint" id="fr-up-hint"></span>
      </div>
      <div class="fr-gap" id="fr-gap" aria-hidden="true"></div>
      <div class="fr-card">
        <span class="fr-label" id="fr-page-label"></span>
        <strong class="fr-value" id="fr-page-value"></strong>
        <span class="fr-sub" id="fr-page-sub"></span>
        <span class="fr-hint" id="fr-page-hint"></span>
      </div>
    </div>
    <p id="fr-verdict" class="fr-verdict"></p>
  </section>

  <!-- ① Claude Code 内置命令：主表 -->
  <section id="sec-builtin" class="section" data-section="builtin">
    <p id="builtin-lead" class="copy-help"></p>
    <!-- 列名单独一张表，和各卡片用同一套固定列宽，所以列能对齐 -->
    <table class="bi-table legend-table" aria-hidden="true">
      <colgroup>
        <col class="w-bicmd"><col class="w-bicopy"><col class="w-bipairs"><col class="w-bipurpose">
      </colgroup>
      <thead><tr id="table-head"></tr></thead>
    </table>
    <div id="builtin-body" class="group-cards"></div>
    <p id="empty-state" class="empty-state" hidden></p>
    <p id="builtin-authority" class="builtin-authority"></p>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p id="sources"></p>
    <p id="disclaimer" class="disclaimer"></p>
    <p class="meta-line">
      <a href="https://github.com/MacroMozilla/ClaudeCodeCMD">GitHub</a> ·
      <a href="https://github.com/MacroMozilla/ClaudeCodeCMD/blob/master/LICENSE">MIT</a> ·
      <span id="version"></span>
    </p>
  </div>
</footer>

<a href="#" id="to-top" class="to-top" hidden>↑</a>

<noscript>
  <div class="wrap noscript">
    这个页面靠 JavaScript 渲染 <code>commands.json</code>。不想开 JS 的话，
    <a href="https://github.com/MacroMozilla/ClaudeCodeCMD#readme">README</a>
    里有同样内容的纯文本版。
  </div>
</noscript>

<script src="app.js?v=4.3.0"></script>
</body>
</html>
