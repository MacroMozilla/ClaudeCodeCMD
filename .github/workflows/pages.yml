name: Deploy to GitHub Pages

# 这个 workflow 存在的唯一理由：`configure-pages` 的 enablement: true 会在
# Pages 没开的时候替你开，省掉手动去 Settings → Pages 点一下。
# 它不构建任何东西 —— 只是把仓库根目录原样上传，和分支直发 Pages 效果一致。
# 如果你更想用「Settings → Pages → Source 选 master 根目录」那种方式，
# 删掉这个文件、去设置里手动开即可，站点行为完全一样。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 内容和代码分离的代价是 JSON 一旦语法错整站白屏，所以上线前挡一道
      - name: Validate commands.json
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('commands.json', encoding='utf-8'))
          ids = {c['id'] for c in d['commands']}
          errs = []
          for c in d['commands']:
              for k in ('id','name','summary','risk','category','section','prompt','commandFile'):
                  if not c.get(k): errs.append(f"{c['id']}: 缺字段 {k}")
              for side in ('before','after'):
                  for p in c['pairs'][side]:
                      if p['id'] not in ids: errs.append(f"{c['id']}: 配对指向不存在的 {p['id']}")
              fm = c['commandFile']['frontmatter']
              # 只读命令必须靠 disallowed-tools 兜底：allowed-tools 是免批准，不是限制
              if c['risk'] == 'readonly' and 'disallowed-tools' not in fm:
                  errs.append(f"{c['id']}: 只读命令缺 disallowed-tools")
          for a in d['antipatterns']:
              for r in a['related']:
                  if r not in ids: errs.append(f"{a['id']}: related 指向不存在的 {r}")
          for s in d['flow']['steps']:
              for cid in s['commands']:
                  if cid not in ids: errs.append(f"flow 第 {s['n']} 步指向不存在的 {cid}")
          if errs:
              print('\n'.join('  - ' + e for e in errs)); sys.exit(1)
          print(f"OK — {len(d['commands'])} 条命令，{len(d['antipatterns'])} 条反模式")
          PY

      - name: Check commands/*.md are in sync with commands.json
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          d = json.load(open('commands.json', encoding='utf-8'))
          stale = []
          for c in d['commands']:
              fm = c['commandFile']['frontmatter']
              lines = ['---']
              for k, v in fm.items():
                  lines.append(f"{k}: {'true' if v is True else 'false' if v is False else v}")
              lines += ['---', '', c['prompt'], '']
              want = "\n".join(lines)
              p = pathlib.Path('commands') / f"{c['name']}.md"
              if not p.exists() or p.read_text(encoding='utf-8') != want:
                  stale.append(str(p))
          if stale:
              print('这些文件和 commands.json 对不上，重新生成后再推：')
              print('\n'.join('  - ' + s for s in stale)); sys.exit(1)
          print(f"OK — {len(d['commands'])} 个命令文件与 JSON 一致")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
